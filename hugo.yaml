        links:
          - icon: fab fa-github
            url: https://github.com/rival4567

      # ----------------------------------------------------
      # Project 2: Automated Bending Workcell (Digital Twin + Real System)
      # ----------------------------------------------------
      - title: "Automated Bending Workcell – Digital Twin & Real Deployment"
        content: |-
          Designed, programmed, and deployed an industrial robotic bending workcell achieving 2× throughput improvement and ~0.5 mm repeatability using machine vision.  
          Built a digital twin in Isaac Sim to validate robot trajectories and workcell safety before real‑world execution.
        # image: /images/projects/bendingcell.jpg
        featured:
          name: Email Me
          link: mailto:shivam0.mechatronics@gmail.com
        badges:
