        content: |-
          Developed a lightweight web dashboard for remote monitoring of robot states, diagnostics, and task progress in automation workflows.  
          Integrated REST endpoints and WebSockets for live updates from the robot controller.
        image: /images/projects/dashboard.jpg
        featured:
