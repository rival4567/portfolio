      - title: "ROS2 Multi-Robot Control Interface"
        content: |-
          Developed a ROS2-based centralized interface to coordinate and manage multiple robots in research environments.  
          Enabled synchronized task execution, real-time monitoring, and modular integration of heterogeneous robotic platforms.
        # image: /images/projects/multirobot.jpg
        featured:
          name: Contact
          link: mailto:shivam0.mechatronics@gmail.com
        badges:
