              - Built high-fidelity digital twins in NVIDIA Isaac Sim to accelerate development cycles and de-risk real-world deployment.
              - Designed modular simulation pipelines for rapid testing of automation strategies.
              - Conducted experiments with UR, Yaskawa, Fanuc, ABB, and Kassow robots for automation workflows.
              - Wrote technical reports, research documentation, and experiment summaries for industrial and academic partners; and prepared material for project grant proposals.
              - Initiated and organized a monthly knowledge-sharing event to promote discussion in my team on new robotics technologies.
            info:
              content: "ROS2, Isaac Sim, Python, C++, Docker, Linux"
            featuredItems:
