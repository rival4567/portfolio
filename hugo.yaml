      # ----------------------------------------------------
      - title: "Digital Twin Simulation Framework (Isaac Sim)"
        content: |-
          Built modular digital-twin pipelines using NVIDIA Isaac Sim to simulate industrial workflows, robotic workcells, and perception systems.  
          Enabled rapid iteration on automation strategies without hardware downtime.
        image: /images/projects/digitaltwin.jpg
        featured:
