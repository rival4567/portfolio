  # About
  about:
    enable: true
    title: "About Me"
    image: "/images/me.png"
    content: |-
      I am a Robotics & Automation Engineer specializing in ROS/ROS2, Isaac Sim, robotic workcells, and advanced robotic simulations.
      I have hands-on experience with industrial robots including Universal Robots (UR), Kassow, Yaskawa Motoman, MiR mobile robots, Fanuc, and ABB systems.
      With 4 years of experience in robotics research and development, I have worked on multi-robot coordination, automation of industrial processes, and simulation driven development.
      
      Currently, I work as a Scientific Researcher in Intelligent Robotics at TC Cham, where I develop robot interfaces, digital twins, and simulation tools that accelerate research workflows in industrial environments.
      I enjoy designing real-world robotic solutions, optimizing industrial tasks through automation, and exploring open-source technologies across robotics, self-hosting, and AI-powered applications.

    skills:
      enable: true
      title: "Technologies I work with:"
      items:
        - "ROS2"
        - "Isaac Sim"
        - "Gazebo"
        - "URDF"
        - "XACRO"
        - "Nav2"
        - "SLAM"
        - "OpenCV"
        - "LiDAR"
        - "SensorFusion"
        - "Linux"
        - "Docker"
        - "Python"
        - "C++"
        - "Git"
        - "Industrial Cameras"
        - "Robot Programming"
        - "Digital Twin Development"
        - "Automation/Robotic Workcells"
        - "Blender"

